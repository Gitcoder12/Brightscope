```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brightscope</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

input{
    width:70%;
    padding:12px;
    border:none;
    border-radius:10px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.result{
    background:#1e293b;
    margin:12px 0;
    padding:15px;
    border-radius:10px;
}

a{
    color:#60a5fa;
}

#debug{
    margin-top:20px;
    color:#94a3b8;
}
</style>
</head>
<body>

<h1>🔬 Brightscope</h1>

<input
id="query"
placeholder="machine learning, quantum computing..."
>

<button onclick="searchAll()">
Search
</button>

<div id="debug"></div>

<hr>

<div id="results"></div>

<script type="module">

import { searchCrossref } from "./crossref.js";
import { searchOpenAlex } from "./openalex.js";

console.log("Brightscope loaded");

window.searchAll = async function() {

    const query =
        document.getElementById("query").value.trim();

    if(!query){
        alert("Enter a topic");
        return;
    }

    const resultsDiv =
        document.getElementById("results");

    const debugDiv =
        document.getElementById("debug");

    resultsDiv.innerHTML =
        "<p>Searching...</p>";

    debugDiv.innerHTML = "";

    let results = [];

    try {

        const crossref =
            await searchCrossref(query);

        debugDiv.innerHTML +=
            "✅ Crossref loaded<br>";

        crossref.forEach(item => {

            results.push({
                title:item.title?.[0] || "Untitled",
                authors:item.author?.map(a =>
                    `${a.given || ""} ${a.family || ""}`
                ).join(", ") || "Unknown",
                year:item.published?.["date-parts"]?.[0]?.[0] || "",
                link:item.URL || "#",
                source:"Crossref"
            });

        });

    } catch(err){

        console.error(err);

        debugDiv.innerHTML +=
            "❌ Crossref failed<br>";
    }

    try {

        const openalex =
            await searchOpenAlex(query);

        debugDiv.innerHTML +=
            "✅ OpenAlex loaded<br>";

        openalex.forEach(item => {

            results.push({
                title:item.display_name || "Untitled",
                authors:item.authorships?.map(a =>
                    a.author?.display_name
                ).join(", ") || "Unknown",
                year:item.publication_year || "",
                link:item.id || "#",
                source:"OpenAlex"
            });

        });

    } catch(err){

        console.error(err);

        debugDiv.innerHTML +=
            "❌ OpenAlex failed<br>";
    }

    const unique =
        [...new Map(
            results.map(r => [r.title, r])
        ).values()];

    unique.sort(
        (a,b)=>(b.year||0)-(a.year||0)
    );

    if(unique.length === 0){

        resultsDiv.innerHTML =
            "<h3>No results found</h3>";

        return;
    }

    resultsDiv.innerHTML =
        unique.map(r => `
            <div class="result">

                <h3>
                    <a href="${r.link}" target="_blank">
                        ${r.title}
                    </a>
                </h3>

                <p>
                    <b>Authors:</b>
                    ${r.authors}
                </p>

                <p>
                    <b>Year:</b>
                    ${r.year}
                </p>

                <p>
                    <b>Source:</b>
                    ${r.source}
                </p>

            </div>
        `).join("");

};

</script>

</body>
</html>
```
