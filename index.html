<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brightscope – Research & Patent Intelligence</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="container">
    <h1>🔬 Brightscope</h1>
    <div class="sub">Search papers, patents – from Crossref, arXiv, Semantic Scholar, PatentsView, and more.</div>
    <div class="search-box">
        <input type="text" id="query" placeholder="e.g., quantum machine learning, crispr, graphene" autocomplete="off">
        <button id="searchBtn">Search All →</button>
    </div>
    <div id="debug" class="debug">⚡ Ready – enter a topic</div>

    <div class="dashboard">
        <div class="card"><div class="card-header">👨‍🔬 Top Authors</div><div id="authorsPanel" class="card-content">—</div></div>
        <div class="card"><div class="card-header">🔥 Top Topics</div><div id="topicsPanel" class="card-content">—</div></div>
        <div class="card"><div class="card-header">📚 Top Papers</div><div id="papersPanel" class="card-content">—</div></div>
        <div class="card"><div class="card-header">📜 Recent Patents</div><div id="patentsPanel" class="card-content">—</div></div>
    </div>

    <div id="resultsList"></div>
    <footer>Brightscope · All sources with fallbacks · No backend required</footer>
</div>

<script type="module">
    // ========== IMPORTS ==========
    import { searchCrossref } from './api/crossref.js';
    import { searchOpenAlex } from './api/openalex.js';
    import { searchArxiv } from './api/arxiv.js';
    import { searchPatents } from './api/patents.js';
    import { searchPubMed } from './api/pubmed.js';
    import { searchDOAJ } from './api/doaj.js';
    import { dedupeByTitle } from './js/core/dedupe.js';
    import { sortByYear, sortByCitations } from './js/core/sort-filter.js';
    import { renderPapers, renderAuthors, renderTopPapers } from './js/ui/render-papers.js';
    import { updateDashboard } from './js/ui/dashboard.js';

    // ========== DOM ELEMENTS ==========
    const queryInput = document.getElementById('query');
    const searchBtn = document.getElementById('searchBtn');
    const debugDiv = document.getElementById('debug');
    const authorsPanel = document.getElementById('authorsPanel');
    const topicsPanel = document.getElementById('topicsPanel');
    const papersPanel = document.getElementById('papersPanel');
    const patentsPanel = document.getElementById('patentsPanel');
    const resultsList = document.getElementById('resultsList');

    // ========== FETCH ALL SOURCES ==========
    async function fetchAllSources(query) {
        const sources = [
            searchCrossref(query).catch(e => { debugDiv.innerHTML += `❌ Crossref error: ${e.message}<br>`; return []; }),
            searchOpenAlex(query).catch(e => { debugDiv.innerHTML += `❌ OpenAlex error: ${e.message}<br>`; return []; }),
            searchArxiv(query).catch(e => { debugDiv.innerHTML += `❌ arXiv error: ${e.message}<br>`; return []; }),
            searchPatents(query).catch(e => { debugDiv.innerHTML += `❌ Patents error: ${e.message}<br>`; return []; }),
            searchPubMed(query).catch(e => { debugDiv.innerHTML += `❌ PubMed error: ${e.message}<br>`; return []; }),
            searchDOAJ(query).catch(e => { debugDiv.innerHTML += `❌ DOAJ error: ${e.message}<br>`; return []; })
        ];
        const results = await Promise.allSettled(sources);
        let allItems = [];
        results.forEach((res, idx) => {
            if (res.status === 'fulfilled' && res.value.length) {
                allItems.push(...res.value);
                const sourceName = ['Crossref','OpenAlex','arXiv','Patents','PubMed','DOAJ'][idx];
                debugDiv.innerHTML += `<span style="color:green;">✅ ${sourceName}: ${res.value.length} items</span><br>`;
            }
        });
        return allItems;
    }

    // ========== MAIN SEARCH ==========
    async function searchAll() {
        const query = queryInput.value.trim();
        if (!query) { debugDiv.innerHTML = '⚠️ Enter a topic'; return; }
        debugDiv.innerHTML = `🔍 Searching for "${query}" ...<br>`;
        resultsList.innerHTML = '<div class="empty-message">⏳ Loading results...</div>';
        authorsPanel.innerHTML = '<div class="empty-message">📊 Computing...</div>';
        topicsPanel.innerHTML = '<div class="empty-message">📊 Extracting topics...</div>';
        papersPanel.innerHTML = '<div class="empty-message">📊 Loading papers...</div>';
        patentsPanel.innerHTML = '<div class="empty-message">📊 Loading patents...</div>';

        const start = Date.now();
        let allItems = await fetchAllSources(query);
        allItems = dedupeByTitle(allItems);
        allItems = sortByYear(allItems, true);

        const papers = allItems.filter(i => i.type !== 'patent');
        const patents = allItems.filter(i => i.type === 'patent');

        // Render main results list
        if (allItems.length) {
            resultsList.innerHTML = `<div style="margin-bottom:12px;"><strong>${allItems.length} unique results</strong></div>` +
                allItems.map(item => `
                    <div class="result-card">
                        <div class="result-title"><a href="${escapeHtml(item.url)}" target="_blank">${escapeHtml(item.title)}</a></div>
                        <div class="result-details">
                            <span class="badge-source">${escapeHtml(item.source)}</span>
                            <span>📅 ${escapeHtml(item.date)}</span>
                            <span>${item.type === 'patent' ? '⚖️ Patent' : '📖 Paper'}</span>
                            ${item.citations ? `<span>📊 ${item.citations} citations</span>` : ''}
                        </div>
                        <div class="abstract">${escapeHtml(item.abstract) || 'No abstract available.'}</div>
                    </div>
                `).join('');
        } else {
            resultsList.innerHTML = '<div class="empty-message">No results. Try a different topic.</div>';
        }

        // Update dashboard using your UI modules
        updateDashboard(papers, patents, authorsPanel, topicsPanel, papersPanel, patentsPanel);

        const elapsed = ((Date.now() - start)/1000).toFixed(1);
        debugDiv.innerHTML += `<span style="color:green; font-weight:bold;">✅ Done: ${papers.length} papers + ${patents.length} patents = ${allItems.length} unique results in ${elapsed}s</span>`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }

    // Event listeners
    searchBtn.onclick = searchAll;
    queryInput.onkeypress = e => e.key === 'Enter' && searchAll();
</script>
</body>
</html>
