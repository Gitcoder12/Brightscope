<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brightscope – Fixed Search</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 20px; background: #f0f4fa; }
        .container { background: white; border-radius: 28px; padding: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h1 { color: #1e3a8a; margin: 0 0 8px; }
        input, button { padding: 12px 16px; font-size: 1rem; margin: 8px 0; border-radius: 60px; border: 1px solid #cbd5e1; }
        input { width: 70%; }
        button { background: #2563eb; color: white; border: none; cursor: pointer; }
        .result { border-bottom: 1px solid #e2e8f0; margin: 20px 0; padding-bottom: 16px; }
        .error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 20px; margin: 12px 0; }
        .debug { font-size: 0.7rem; color: #64748b; margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Brightscope (CORS‑fixed)</h1>
    <p>Search arXiv papers via fallback proxies – works on GitHub Pages</p>
    <input type="text" id="query" placeholder="e.g., quantum machine learning" style="width: calc(100% - 100px);">
    <button id="searchBtn">Search</button>
    <div id="results"></div>
    <div id="debug" class="debug"></div>
</div>

<script>
    const PROXIES = [
        'https://api.allorigins.win/raw?url=',
        'https://corsproxy.io/?',
        'https://thingproxy.freeboard.io/fetch/'
    ];
    let currentProxyIndex = 0;

    async function searchWithProxy(query, proxyUrl) {
        const arxivUrl = `https://export.arxiv.org/api/query?search_query=all:${encodeURIComponent(query)}&max_results=8`;
        const fullUrl = proxyUrl + encodeURIComponent(arxivUrl);
        const response = await fetch(fullUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.text();
    }

    async function search() {
        const query = document.getElementById('query').value.trim();
        if (!query) return;
        const resultsDiv = document.getElementById('results');
        const debugDiv = document.getElementById('debug');
        resultsDiv.innerHTML = '<div>🔍 Searching... trying fallback proxies</div>';
        debugDiv.innerHTML = '';

        for (let i = 0; i < PROXIES.length; i++) {
            try {
                debugDiv.innerHTML += `Trying proxy ${i+1}: ${PROXIES[i]}<br>`;
                const xmlText = await searchWithProxy(query, PROXIES[i]);
                // Parse XML
                const parser = new DOMParser();
                const xml = parser.parseFromString(xmlText, 'text/xml');
                const entries = xml.querySelectorAll('entry');
                if (entries.length === 0) {
                    resultsDiv.innerHTML = '<div>No results found.</div>';
                    return;
                }
                let html = `<div>✅ Found ${entries.length} results (via proxy ${i+1})</div>`;
                for (let entry of entries) {
                    const title = entry.querySelector('title')?.textContent || 'No title';
                    const link = entry.querySelector('id')?.textContent || '#';
                    const summary = entry.querySelector('summary')?.textContent?.slice(0, 250) || '';
                    html += `
                        <div class="result">
                            <strong><a href="${link}" target="_blank">${escapeHtml(title)}</a></strong><br>
                            <small>${escapeHtml(summary)}...</small>
                        </div>
                    `;
                }
                resultsDiv.innerHTML = html;
                debugDiv.innerHTML += `<span style="color: green;">✅ Success with proxy ${i+1}</span>`;
                return;
            } catch (err) {
                debugDiv.innerHTML += `<span style="color: red;">❌ Proxy ${i+1} failed: ${err.message}</span><br>`;
            }
        }
        resultsDiv.innerHTML = `<div class="error">❌ All proxies failed. Check your internet or GitHub Pages settings.<br>
        Error details: see debug console (F12).</div>`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    document.getElementById('searchBtn').addEventListener('click', search);
    document.getElementById('query').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') search();
    });
</script>
</body>
</html>
