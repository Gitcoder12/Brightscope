<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brightscope – Research Search</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #f4f6fa;
            color: #1e293b;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .search-box {
            display: flex;
            gap: 12px;
            max-width: 600px;
            margin: 20px auto;
        }
        input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #cbd5e1;
            border-radius: 60px;
            font-size: 1rem;
            outline: none;
        }
        button {
            padding: 12px 28px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #1d4ed8; }
        .results {
            margin-top: 30px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.1s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .title a {
            color: #1e3a8a;
            text-decoration: none;
        }
        .meta {
            font-size: 0.75rem;
            color: #475569;
            margin: 8px 0;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .abstract {
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.4;
            margin-top: 8px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.7rem;
            color: #94a3b8;
        }
        @media (max-width: 640px) {
            .search-box { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🔍 Brightscope</h1>
        <p>Search millions of research papers & patents – no backend, no API keys</p>
    </header>
    <div class="search-box">
        <input type="text" id="query" placeholder="e.g., transformer neural network, CRISPR, quantum computing">
        <button id="searchBtn">Search</button>
    </div>
    <div id="results" class="results"></div>
    <footer>Powered by Crossref + Semantic Scholar (CORS-enabled). Free, unlimited.</footer>
</div>

<script>
    const searchBtn = document.getElementById('searchBtn');
    const queryInput = document.getElementById('query');
    const resultsDiv = document.getElementById('results');

    // ---------- Crossref (CORS-enabled, no key) ----------
    async function searchCrossref(query, limit = 12) {
        const url = `https://api.crossref.org/works?query=${encodeURIComponent(query)}&rows=${limit}&sort=relevance`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`Crossref HTTP ${resp.status}`);
        const data = await resp.json();
        const items = data.message?.items || [];
        return items.map(item => {
            let abstract = item.abstract || '';
            abstract = abstract.replace(/<[^>]*>/g, '').slice(0, 400);
            return {
                title: item.title?.[0] || 'No title',
                abstract: abstract || 'No abstract available.',
                url: item.URL || `https://doi.org/${item.DOI}`,
                date: item.issued?.['date-parts']?.[0]?.[0] || '',
                source: 'Crossref'
            };
        });
    }

    // ---------- Semantic Scholar (CORS-enabled, no key) ----------
    async function searchSemanticScholar(query, limit = 12) {
        const url = `https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(query)}&limit=${limit}&fields=title,abstract,url,publicationDate`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`Semantic Scholar HTTP ${resp.status}`);
        const data = await resp.json();
        return (data.data || []).map(paper => ({
            title: paper.title || 'No title',
            abstract: paper.abstract?.slice(0, 400) || 'No abstract available.',
            url: paper.url || '',
            date: paper.publicationDate?.slice(0, 10) || '',
            source: 'Semantic Scholar'
        }));
    }

    // ---------- Main search ----------
    async function performSearch() {
        const query = queryInput.value.trim();
        if (!query) return;
        resultsDiv.innerHTML = '<div class="loading">⏳ Searching across databases...</div>';
        try {
            // Run both searches in parallel
            const [crossref, semanticscholar] = await Promise.all([
                searchCrossref(query),
                searchSemanticScholar(query)
            ]);
            const all = [...crossref, ...semanticscholar];
            // Deduplicate by title (case-insensitive)
            const seen = new Set();
            const unique = [];
            for (const r of all) {
                const key = r.title.toLowerCase();
                if (!seen.has(key)) {
                    seen.add(key);
                    unique.push(r);
                }
            }
            if (unique.length === 0) {
                resultsDiv.innerHTML = '<div class="loading">No results found. Try a different topic.</div>';
                return;
            }
            // Sort by date (newest first)
            unique.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
            let html = `<div style="margin-bottom: 16px;">📄 ${unique.length} results</div>`;
            for (const r of unique) {
                html += `
                    <div class="card">
                        <div class="title"><a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a></div>
                        <div class="meta">
                            <span>📚 ${r.source}</span>
                            <span>📅 ${r.date || 'Date unknown'}</span>
                        </div>
                        <div class="abstract">${escapeHtml(r.abstract)}</div>
                    </div>
                `;
            }
            resultsDiv.innerHTML = html;
        } catch (err) {
            console.error(err);
            resultsDiv.innerHTML = `<div class="loading">❌ Error: ${err.message}. Please check your internet connection and try again.</div>`;
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    searchBtn.addEventListener('click', performSearch);
    queryInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
</script>
</body>
</html>
