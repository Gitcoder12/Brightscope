<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightscope · Research Discovery</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0b1120;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #eef2ff;
      padding: 2rem 1.5rem;
      line-height: 1.5;
    }
    .container { max-width: 1300px; margin: 0 auto; }
    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #c084fc, #60a5fa);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .search-panel {
      background: #111827;
      border-radius: 2rem;
      display: flex;
      gap: 0.75rem;
      margin: 1.5rem 0 1rem;
      border: 1px solid #1e293b;
      padding: 0.5rem;
    }
    #query {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      color: #f1f5f9;
      outline: none;
    }
    button {
      background: #3b82f6;
      border: none;
      padding: 0 1.8rem;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }
    .debug-bar {
      background: #0f172a;
      border-radius: 20px;
      padding: 0.6rem 1rem;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin: 2rem 0;
    }
    .card {
      background: #0f172a;
      border-radius: 1.5rem;
      border: 1px solid #1e293b;
    }
    .card-header {
      background: #1e293b;
      padding: 1rem 1.5rem;
      font-weight: 700;
      border-bottom: 1px solid #334155;
    }
    .card-content {
      padding: 1.2rem;
      max-height: 380px;
      overflow-y: auto;
    }
    .result-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1.2rem;
      padding: 1rem 1.5rem;
      margin-bottom: 1rem;
    }
    .result-title a {
      color: #93c5fd;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .result-details {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      color: #cbd5e1;
    }
    .badge-source {
      background: #1e293b;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
    }
    .empty-message {
      text-align: center;
      color: #64748b;
      padding: 1rem;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🔬 Brightscope</h1>
  <div class="search-panel">
    <input id="query" placeholder="e.g., quantum machine learning, crispr, transformers">
    <button id="searchBtn">Search</button>
  </div>
  <div id="debug" class="debug-bar">⚡ Ready — search any research topic</div>

  <div class="dashboard">
    <div class="card"><div class="card-header">👨‍🔬 Top Authors</div><div id="authorsPanel" class="card-content">—</div></div>
    <div class="card"><div class="card-header">🔥 Top Topics</div><div id="topicsPanel" class="card-content">—</div></div>
    <div class="card"><div class="card-header">📚 Top Papers</div><div id="papersPanel" class="card-content">—</div></div>
  </div>

  <h2>📄 All Publications</h2>
  <div id="resultsList"></div>
</div>

<script type="module">
  import { searchCrossref } from "./crossref.js";
  import { searchOpenAlex } from "./openalex.js";

  const queryInput = document.getElementById('query');
  const searchBtn = document.getElementById('searchBtn');
  const debugDiv = document.getElementById('debug');
  const authorsPanel = document.getElementById('authorsPanel');
  const topicsPanel = document.getElementById('topicsPanel');
  const papersPanel = document.getElementById('papersPanel');
  const resultsList = document.getElementById('resultsList');

  function escapeHtml(str) { return str?.replace(/[&<>]/g, function(m) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]; }) || ''; }

  async function searchAll() {
    const query = queryInput.value.trim();
    if (!query) { debugDiv.innerHTML = '⚠️ Enter a topic'; return; }
    debugDiv.innerHTML = `🔍 Searching for "${query}" ...`;
    authorsPanel.innerHTML = '<div class="empty-message">Loading authors...</div>';
    topicsPanel.innerHTML = '<div class="empty-message">Extracting topics...</div>';
    papersPanel.innerHTML = '<div class="empty-message">Loading papers...</div>';
    resultsList.innerHTML = '<div class="empty-message">Fetching results...</div>';

    let crossrefPapers = [], openalexPapers = [];
    try { crossrefPapers = await searchCrossref(query); } catch(e) { debugDiv.innerHTML += `<br>❌ Crossref error: ${e.message}`; }
    try { openalexPapers = await searchOpenAlex(query); } catch(e) { debugDiv.innerHTML += `<br>❌ OpenAlex error: ${e.message}`; }

    const all = [...crossrefPapers, ...openalexPapers];
    if (all.length === 0) {
      resultsList.innerHTML = '<div class="empty-message">No results. Try another topic.</div>';
      return;
    }

    // Deduplicate by title (case‑insensitive)
    const unique = new Map();
    for (const p of all) {
      const key = p.title?.trim().toLowerCase();
      if (key && !unique.has(key)) unique.set(key, p);
    }
    let papers = Array.from(unique.values());
    papers.sort((a,b) => (b.year||0) - (a.year||0));

    // --- Top Authors ---
    const authorCount = new Map();
    papers.forEach(p => {
      const authors = p.authors || '';
      authors.split(',').forEach(a => {
        const name = a.trim();
        if (name && name !== 'Unknown') authorCount.set(name, (authorCount.get(name)||0)+1);
      });
    });
    const topAuthors = Array.from(authorCount.entries()).sort((a,b)=>b[1]-a[1]).slice(0,10);
    authorsPanel.innerHTML = topAuthors.length ? topAuthors.map(([name, cnt]) => `<div><b>${escapeHtml(name)}</b> · ${cnt} paper${cnt>1?'s':''}</div>`).join('') : '<div class="empty-message">No author data</div>';

    // --- Top Topics (keywords from titles) ---
    const stopWords = new Set(['using','based','model','method','analysis','study','paper','research','data','learning','network','system','approach']);
    const topicFreq = new Map();
    papers.forEach(p => {
      const words = (p.title||'').toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(w => w.length>=5 && !stopWords.has(w));
      words.forEach(w => topicFreq.set(w, (topicFreq.get(w)||0)+1));
    });
    const topTopics = Array.from(topicFreq.entries()).sort((a,b)=>b[1]-a[1]).slice(0,12);
    topicsPanel.innerHTML = topTopics.length ? topTopics.map(([t,f]) => `<div><b>#${escapeHtml(t)}</b> · ${f} mentions</div>`).join('') : '<div class="empty-message">No topics extracted</div>';

    // --- Top Papers (first 10) ---
    const topPapersList = papers.slice(0,10);
    papersPanel.innerHTML = topPapersList.map(p => `<div><b>${escapeHtml(p.title.length>70?p.title.slice(0,67)+'...':p.title)}</b><br><small>${p.year||'n.d.'} · ${p.source}</small></div>`).join('');

    // --- Full results ---
    resultsList.innerHTML = papers.map(p => `
      <div class="result-card">
        <div class="result-title"><a href="${escapeHtml(p.link)}" target="_blank">${escapeHtml(p.title)}</a></div>
        <div class="result-details">
          <span><b>Authors:</b> ${escapeHtml(p.authors||'Unknown')}</span>
          <span><b>Year:</b> ${p.year||'—'}</span>
          <span class="badge-source">${escapeHtml(p.source)}</span>
        </div>
      </div>
    `).join('');
    debugDiv.innerHTML = `✅ ${papers.length} unique papers · ${topAuthors.length} authors · ${topTopics.length} topics`;
  }

  searchBtn.addEventListener('click', searchAll);
  queryInput.addEventListener('keypress', e => e.key === 'Enter' && searchAll());
</script>
</body>
</html>
