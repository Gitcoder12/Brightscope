<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Brightscope V1</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

input{
    width:70%;
    padding:10px;
}

button{
    padding:10px 20px;
}

.result{
    border-bottom:1px solid #ddd;
    padding:12px;
}

.debug{
    margin-top:20px;
    color:#666;
}
</style>
</head>
<body>

<h1>🔬 Brightscope</h1>

<input
id="query"
placeholder="Search research topic..."
>

<button onclick="searchAll()">
Search
</button>

<div id="results"></div>

<div id="debug" class="debug"></div>

<script type="module">

import { searchCrossref }
from "./data/crossref.js";

import { searchOpenAlex }
from "./data/openalex.js";

window.searchAll = async function() {

    const query =
        document.getElementById("query").value.trim();

    if(!query) return;

    const resultsDiv =
        document.getElementById("results");

    const debugDiv =
        document.getElementById("debug");

    resultsDiv.innerHTML =
        "Searching...";

    debugDiv.innerHTML = "";

    let results = [];

    try {

        const crossref =
            await searchCrossref(query);

        results.push(...crossref);

        debugDiv.innerHTML +=
            "✅ Crossref OK<br>";

    } catch(err) {

        debugDiv.innerHTML +=
            "❌ Crossref Failed<br>";
    }

    try {

        const openalex =
            await searchOpenAlex(query);

        results.push(...openalex);

        debugDiv.innerHTML +=
            "✅ OpenAlex OK<br>";

    } catch(err) {

        debugDiv.innerHTML +=
            "❌ OpenAlex Failed<br>";
    }

    const unique =
        [...new Map(
            results.map(r => [r.title, r])
        ).values()];

    unique.sort(
        (a,b)=>(b.year||0)-(a.year||0)
    );

    resultsDiv.innerHTML =
        unique.map(r => `
            <div class="result">

                <h3>
                    <a href="${r.link}"
                       target="_blank">
                       ${r.title}
                    </a>
                </h3>

                <p>
                    <b>Authors:</b>
                    ${r.authors}
                </p>

                <p>
                    <b>Year:</b>
                    ${r.year}
                </p>

                <p>
                    <b>Source:</b>
                    ${r.source}
                </p>

            </div>
        `).join("");

};

</script>

</body>
</html>
