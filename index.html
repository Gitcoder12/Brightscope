<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightscope – Unified Research + Patent Search</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="container">
  <h1>🔬 Brightscope</h1>
  <div class="sub">Search papers, preprints, patents – from Crossref, OpenAlex, arXiv, PubMed, DOAJ, and PatentsView</div>
  <div class="search-box">
    <input type="text" id="query" placeholder="e.g., quantum machine learning, crispr, graphene" autocomplete="off">
    <button id="searchBtn">Search All →</button>
  </div>
  <div id="debug" class="debug">⚡ Ready – enter a topic</div>

  <div class="dashboard">
    <div class="card"><div class="card-header">👨‍🔬 Top Authors</div><div id="authorsPanel" class="card-content">—</div></div>
    <div class="card"><div class="card-header">🔥 Top Topics</div><div id="topicsPanel" class="card-content">—</div></div>
    <div class="card"><div class="card-header">📚 Top Papers</div><div id="papersPanel" class="card-content">—</div></div>
    <div class="card"><div class="card-header">📜 Recent Patents</div><div id="patentsPanel" class="card-content">—</div></div>
  </div>

  <div id="resultsList"></div>
  <footer>Brightscope · All sources with CORS fallbacks · No backend required</footer>
</div>

<script type="module">
  import { aggregateAll } from './js/aggregator.js';
  import { dedupeByTitle } from './js/dedupe.js';
  import { sortByDate } from './js/sort.js';
  import { renderResults, updateDashboard } from './js/ui.js';

  const queryInput = document.getElementById('query');
  const searchBtn = document.getElementById('searchBtn');
  const debugDiv = document.getElementById('debug');
  const resultsDiv = document.getElementById('resultsList');

  async function searchAll() {
    const query = queryInput.value.trim();
    if (!query) return;
    debugDiv.innerHTML = `🔍 Searching for "${query}" ...<br>`;
    resultsDiv.innerHTML = '<div class="empty-message">⏳ Loading results from all sources...</div>';

    const start = Date.now();
    let all = await aggregateAll(query);
    all = dedupeByTitle(all);
    all = sortByDate(all);
    const elapsed = ((Date.now() - start)/1000).toFixed(1);

    renderResults(resultsDiv, all);
    debugDiv.innerHTML += `<span style="color:green;">✅ ${all.length} unique results in ${elapsed}s</span>`;
    // Simple dashboard placeholders
    updateDashboard('authorsPanel', all.slice(0,5), 'authors');
    updateDashboard('topicsPanel', all.slice(0,5), 'topics');
    updateDashboard('papersPanel', all.filter(i => i.type !== 'patent').slice(0,8), 'papers');
    updateDashboard('patentsPanel', all.filter(i => i.type === 'patent').slice(0,6), 'patents');
  }

  searchBtn.onclick = searchAll;
  queryInput.onkeypress = e => e.key === 'Enter' && searchAll();
</script>
</body>
</html>
