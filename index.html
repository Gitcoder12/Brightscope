      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --text: #e8eaf6;
      --muted: #8b90b0;
      --tag-physics: #4a90d9;
      --tag-ai: #9c59d1;
      --tag-biology: #3cb371;

    }

    }

      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,.5);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      height: 64px;
    }

    .logo {

      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-icon {

      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Search bar ── */
    .search-wrap {
      flex: 1;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      padding: 10px 14px 10px 42px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    #searchInput::placeholder { color: var(--muted); }
    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,.2);
    }

      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 28px;
      align-items: start;
    }

    /* ── Sidebar ── */
    aside {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: sticky;
      top: 80px;
    }

    aside h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .filter-group { display: flex; flex-direction: column; gap: 6px; }

    .filter-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      transition: background .15s, border-color .15s;
    }

    .filter-btn:hover { background: var(--surface2); }
    .filter-btn.active {
      background: rgba(108,99,255,.15);
      border-color: var(--accent);
      color: #b8b4ff;
    }

    .filter-count {
      font-size: 0.75rem;
      background: var(--surface2);
      border-radius: 20px;
      padding: 1px 8px;
      color: var(--muted);
    }

    .filter-btn.active .filter-count {
      background: rgba(108,99,255,.3);
      color: #b8b4ff;
    }

      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;

    .results-count {
      font-size: 0.9rem;
      color: var(--muted);
    }

      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      transition: border-color .2s, box-shadow .2s;
      cursor: pointer;

      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(108,99,255,.2), var(--shadow);
    }

    .paper-card.expanded { border-color: var(--accent); }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .paper-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      flex: 1;
    }

    .category-tag {
      flex-shrink: 0;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #fff;
    }

    .tag-Physics    { background: var(--tag-physics); }
    .tag-AI         { background: var(--tag-ai); }
    .tag-Biology    { background: var(--tag-biology); }
    .tag-Chemistry  { background: var(--tag-chemistry); }
    .tag-Medicine   { background: var(--tag-medicine); }

      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .paper-meta span { display: flex; align-items: center; gap: 4px; }

    .paper-authors { margin-top: 6px; font-size: 0.85rem; color: var(--muted); }

    /* Expandable abstract */
    .paper-abstract {
      margin-top: 14px;
      font-size: 0.88rem;
      color: #c0c4dc;
      line-height: 1.7;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: none;
    }

    .paper-card.expanded .paper-abstract { display: block; }

    .expand-hint {
      font-size: 0.78rem;
      color: var(--accent);
      margin-top: 10px;
      display: inline-block;
    }

    .paper-card.expanded .expand-hint::after { content: " ▲"; }
    .paper-card:not(.expanded) .expand-hint::after { content: " ▼"; }

    /* Citation badge */
    .cite-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,212,170,.12);
      color: var(--accent2);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state svg { margin-bottom: 16px; opacity: .4; }
    .empty-state p { font-size: 1.1rem; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        padding: 16px;
      }

      aside {
        position: static;
      }

      .filter-group { flex-direction: row; flex-wrap: wrap; }
      .filter-btn { flex: 1 1 auto; justify-content: center; }
      .filter-count { display: none; }

      .header-inner { height: auto; padding: 12px 0; flex-wrap: wrap; }
      header { position: static; }
    }

    /* ── Highlight match ── */
    mark {
      background: rgba(108,99,255,.35);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }
  </style>
</head>

// =============================================================
// APP STATE
// =============================================================
let activeCategory = "all";
let searchQuery = "";
let sortBy = "date-desc";

// =============================================================
// HELPERS
// =============================================================
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const safe = escapeHtml(text);
  const safeQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(`(${safeQ})`, 'gi'), '<mark>$1</mark>');
}

function formatDate(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-US', {
    year: 'numeric', month: 'short', day: 'numeric'
  });
}

// =============================================================
// FILTER + SORT
// =============================================================
function getFiltered() {
  const q = searchQuery.toLowerCase().trim();

  return PAPERS.filter(p => {
    const matchCat = activeCategory === "all" || p.category === activeCategory;
    if (!matchCat) return false;
    if (!q) return true;
    return (
      p.title.toLowerCase().includes(q) ||
      p.abstract.toLowerCase().includes(q) ||
      p.authors.some(a => a.toLowerCase().includes(q)) ||
      p.category.toLowerCase().includes(q)
    );
  }).sort((a, b) => {
    if (sortBy === "date-desc") return new Date(b.date) - new Date(a.date);
    if (sortBy === "date-asc")  return new Date(a.date) - new Date(b.date);
    if (sortBy === "citations-desc") return b.citations - a.citations;
    if (sortBy === "title-asc") return a.title.localeCompare(b.title);
    return 0;
  });
}

// =============================================================
// RENDER
// =============================================================
function updateCounts() {
  const q = searchQuery.toLowerCase().trim();

  const matchQuery = p => !q || (
    p.title.toLowerCase().includes(q) ||
    p.abstract.toLowerCase().includes(q) ||
    p.authors.some(a => a.toLowerCase().includes(q)) ||
    p.category.toLowerCase().includes(q)
  );

  const cats = ["Physics", "AI", "Biology", "Chemistry", "Medicine"];
  const allCount = PAPERS.filter(matchQuery).length;

  document.getElementById("count-all").textContent = allCount;
  cats.forEach(cat => {
    const el = document.getElementById(`count-${cat}`);
    if (el) el.textContent = PAPERS.filter(p => p.category === cat && matchQuery(p)).length;
  });
}

function renderPapers() {
  const list = document.getElementById("papersList");
  const countEl = document.getElementById("resultsCount");
  const filtered = getFiltered();
  const q = searchQuery;

  updateCounts();
  countEl.textContent = `${filtered.length} paper${filtered.length !== 1 ? 's' : ''} found`;

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <p>No papers found for "<strong>${escapeHtml(q)}</strong>"</p>
        <p style="font-size:.85rem;margin-top:8px">Try different keywords or clear filters.</p>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(p => `
    <article class="paper-card" data-id="${p.id}" tabindex="0" role="button"
      aria-expanded="false" aria-label="Toggle abstract for ${escapeHtml(p.title)}">
      <div class="card-top">
        <h3 class="paper-title">${highlight(p.title, q)}</h3>
        <span class="category-tag tag-${p.category}">${p.category}</span>
      </div>
      <div class="paper-authors">${highlight(p.authors.join(', '), q)}</div>
      <div class="paper-meta">
        <span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          ${formatDate(p.date)}
        </span>
        <span class="cite-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
          </svg>
          ${p.citations.toLocaleString()} citations
        </span>
        <!-- arXiv link integration point: replace '#' with actual arXiv URL when using live API -->
        <span>
          <a href="https://arxiv.org/abs/${p.arxivId}" target="_blank" rel="noopener noreferrer"
             style="color:var(--accent);text-decoration:none;font-size:.8rem"
             onclick="event.stopPropagation()">arXiv:${p.arxivId} ↗</a>
        </span>
      </div>
      <div class="paper-abstract">${highlight(p.abstract, q)}</div>
      <span class="expand-hint">Abstract</span>
    </article>
  `).join('');

  // Toggle expand
  list.querySelectorAll('.paper-card').forEach(card => {
    const toggle = () => {
      const expanded = card.classList.toggle('expanded');
      card.setAttribute('aria-expanded', expanded);
    };
    card.addEventListener('click', toggle);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  });
}

// =============================================================
// EVENT LISTENERS
// =============================================================

// Search
let debounceTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    searchQuery = e.target.value;
    renderPapers();
  }, 200);
});

// Category filters
document.getElementById('filterGroup').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCategory = btn.dataset.cat;
  renderPapers();
});

// Sort
document.getElementById('sortSelect').addEventListener('change', e => {
  sortBy = e.target.value;
  renderPapers();
});

// =============================================================
// INIT
// =============================================================
renderPapers();
